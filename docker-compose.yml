services:
  sikebut-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sikebut-app:1.0.0
    container_name: sikebut-app
    restart: unless-stopped
    env_file:
      - .env.production
    # CATATAN: seluruh nilai rahasia & alamat HANYA diambil dari .env.production.
    # Jangan diduplikasi di sini memakai `${VAR}` — bila variabel itu tidak ada di
    # shell, Compose justru menimpanya dengan string KOSONG (AUTH_SECRET kosong =
    # login gagal) sekaligus mengalahkan isi .env.production.
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      # Perlu dipublikasikan supaya bisa dijangkau reverse proxy di host
      # (nginx AA Panel). Ganti ke "127.0.0.1:8087:3000" bila hanya untuk proxy.
      - "8087:3000"
    expose:
      - "3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  app-network:
    # WAJIB sama dengan network yang dibuat backend/WA:
    #   docker network create app-network
    # `name` ditulis eksplisit supaya Compose TIDAK mencari nama ber-prefix
    # project (mis. sikebut-app_app-network) yang tidak pernah dibuat.
    external: true
    name: app-network
